<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaborCalc</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    .page-content { max-width: 1200px; margin: 28px auto; padding: 0 20px; }

    /* Nav ribbon */
    nav { background: #1e421e; border-bottom: 2px solid #3a7d44; display: flex; align-items: center; padding: 0 28px; height: 52px; gap: 8px; }
    .nav-brand { color: #c8e6c9; font-size: 15px; font-weight: bold; letter-spacing: 0.03em; margin-right: auto; text-decoration: none; }
    .nav-brand:hover { color: #fff; }
    .nav-link { color: #c8e6c9; text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 4px; transition: background 0.15s; }
    .nav-link:hover { background: rgba(58,125,68,0.6); color: #fff; }
    .nav-link.active { background: #3a7d44; color: #fff; }
    .nav-sep { width: 1px; height: 24px; background: rgba(200,230,201,0.2); }
    .nav-signout { color: #a5c8a7; font-size: 13px; padding: 6px 12px; border-radius: 4px; cursor: pointer; background: none; border: none; font-family: inherit; }
    .nav-signout:hover { background: rgba(200,80,80,0.25); color: #fff; }
    h1 { color: #333; }
    #status { color: #666; font-style: italic; }

    /* --- Projects (level 1) --- */
    table { width: 100%; border-collapse: collapse; margin-top: 0; }
    th { background: #3a7d44; color: white; text-align: left; padding: 10px 12px; }
    td { padding: 9px 12px; border-bottom: 1px solid #ddd; }
    tr.project-row { cursor: pointer; }
    tr.project-row:hover td { background: #f2f7f2; }
    tr.project-row td:nth-child(2)::before { content: '▶ '; font-size: 11px; color: #3a7d44; }
    tr.project-row.open td:nth-child(2)::before { content: '▼ '; }
    tr.wo-container td { padding: 0; background: #f0f5f0; }
    .wo-inner { padding: 8px 20px 12px 40px; display: none; }
    tr.project-row.open + tr.wo-container .wo-inner { display: block; }

    /* --- Work Orders (level 2) --- */
    .wo-inner table { margin-top: 0; width: 100%; border-collapse: collapse; }
    .wo-inner th { background: #5a9e6a; font-size: 13px; padding: 7px 10px; }
    .wo-inner td { font-size: 13px; padding: 6px 10px; }
    tr.wo-row { cursor: pointer; }
    tr.wo-row:hover td { background: #e4f0e6; }
    tr.wo-row td:nth-child(2)::before { content: '▶ '; font-size: 10px; color: #5a9e6a; }
    tr.wo-row.open td:nth-child(2)::before { content: '▼ '; }
    tr.si-container td { padding: 0; background: #e8f2ea; }
    .si-inner { padding: 6px 16px 10px 50px; display: none; }
    tr.wo-row.open + tr.si-container .si-inner { display: block; }

    /* --- Shipment Items (level 3) --- */
    .si-inner table { margin-top: 0; width: 100%; border-collapse: collapse; }
    .si-inner th { background: #82bf90; font-size: 12px; padding: 6px 9px; }
    .si-inner td { font-size: 12px; padding: 5px 9px; }

    .section-title { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; color: #fff; background: #3a7d44; display: inline-block; padding: 3px 10px; border-radius: 4px 4px 0 0; margin-top: 16px; margin-bottom: 0; }
    .wo-inner .section-title { background: #5a9e6a; font-size: 10px; }
    .si-inner .section-title { background: #82bf90; font-size: 10px; }
    /* ID columns visible */
    /* Ensure shipment items columns are never hidden */
    .si-inner th, .si-inner td { display: table-cell !important; }

.wo-loading { color: #888; font-style: italic; font-size: 13px; padding: 6px 0; }
    .wo-qty { color: #888; font-size: 12px; }
    .error { color: red; }
    .filter-form { margin-top: 16px; display: flex; align-items: center; gap: 10px; }
    .filter-form label { font-weight: bold; color: #333; }
    .filter-form input[type="date"], .filter-form input[type="text"] { padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .filter-form button { padding: 7px 16px; background: #3a7d44; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .filter-form button:hover { background: #2e6336; }
    .filter-form button.clear { background: #888; }
    .filter-form button.clear:hover { background: #666; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">Rainier Woodworking</a>
    <a href="/" class="nav-link">Home</a>
    <a href="/laborcalc" class="nav-link active">LaborCalc</a>
    <a href="/activity-drivers" class="nav-link">Activity Drivers</a>
    <div class="nav-sep"></div>
    <form method="POST" action="/auth/logout" style="margin:0">
      <button type="submit" class="nav-signout">Sign Out</button>
    </form>
  </nav>
  <div class="page-content">
  <h1 style="margin:0 0 4px 0; color:#333;">LaborCalc — Innergy Projects</h1>
  <form class="filter-form" id="filter-form">
    <label for="name-filter">Name:</label>
    <input type="text" id="name-filter" placeholder="Project name…">
    <label for="number-filter">Number:</label>
    <input type="text" id="number-filter" placeholder="Project number…">
    <label for="date-from">Created On:</label>
    <input type="date" id="date-from">
    <span>–</span>
    <input type="date" id="date-to">
    <button type="submit">Filter</button>
    <button type="button" class="clear" id="clear-btn">Clear</button>
  </form>
  <p id="status">Loading projects...</p>
  <div class="section-title">Projects</div>
  <table id="projects-table" style="display:none">
    <thead>
      <tr>
        <th>ID</th>
        <th>Project Name</th>
        <th>Number</th>
        <th>Status</th>
        <th>Created On</th>
        <th>WO Qty</th>
      </tr>
    </thead>
    <tbody id="projects-body"></tbody>
  </table>

  <script>
    let allProjects = [];
    const woCache = {};
    const siCache = {};

    function formatDate(val) {
      if (!val) return '—';
      try {
        // Normalise to ISO so Safari doesn't throw on non-standard formats
        const iso = typeof val === 'string' ? val.replace(' ', 'T') : val;
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '—';
        return d.toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
      } catch { return '—'; }
    }

    function projectId(p) {
      return p.Id || p.ProjectId || p.id || p.projectId;
    }

    function workOrderId(w) {
      return w.Id || w.WorkOrderId || w.id || w.workOrderId;
    }

    function customField(w, ...keys) {
      for (const key of keys) {
        if (w[key] !== undefined && w[key] !== null && w[key] !== '') return w[key];
      }
      const cf = w.CustomFields || w.customFields;
      if (Array.isArray(cf)) {
        for (const key of keys) {
          const match = cf.find(f => (f.Name || f.name || '').toLowerCase() === key.toLowerCase());
          if (match) return match.Value || match.value || '—';
        }
      }
      return '—';
    }

    // --- Shipment Items ---

    async function fetchShipmentItems(woId) {
      if (siCache[woId]) return siCache[woId];
      const res = await fetch(`/api/shipmentitems/${encodeURIComponent(woId)}`);
      const data = await res.json();
      const records = Array.isArray(data) ? data : [];
      siCache[woId] = records;
      return records;
    }

    function renderSiContent(items, siDiv) {
      siDiv.innerHTML = '';
      if (!items.length) {
        siDiv.innerHTML = '<p class="wo-loading">No shipment items found.</p>';
        return;
      }
      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = 'Shipment Items';
      siDiv.appendChild(title);
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Item</th><th>Qty</th><th>Description</th><th>Qty Completed</th></tr>';
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      items.forEach(s => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${s.Name || '—'}</td>
          <td>${s.Quantity ?? '—'}</td>
          <td>${s.Description || '—'}</td>
          <td>${s.QuantityCompleted ?? '—'}</td>
        `;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      siDiv.appendChild(table);
    }

    async function loadShipmentItems(woId, siDiv) {
      if (siCache[woId]) { renderSiContent(siCache[woId], siDiv); return siCache[woId]; }
      siDiv.innerHTML = '<p class="wo-loading">Loading shipment items…</p>';
      try {
        const records = await fetchShipmentItems(woId);
        renderSiContent(records, siDiv);
        return records;
      } catch (err) {
        siDiv.innerHTML = `<p class="error">Error: ${err.message}</p>`;
      }
    }

    // --- Work Orders ---

    async function fetchWorkOrders(pid) {
      if (woCache[pid]) return woCache[pid];
      const res = await fetch(`/api/workorders/${encodeURIComponent(pid)}`);
      const data = await res.json();
      const records = Array.isArray(data) ? data : [];
      woCache[pid] = records;
      return records;
    }

    function renderWoContent(workorders, woDiv, pid) {
      woDiv.innerHTML = '';
      if (!workorders.length) {
        woDiv.innerHTML = '<p class="wo-loading">No work orders found.</p>';
        return;
      }

      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = 'Work Orders';
      woDiv.appendChild(title);
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>ID</th><th>Work Order</th><th>Number</th><th>Status</th><th>Created On</th><th>Product Line</th><th>Door Name</th><th>Material</th><th>Finish</th><th>Shipment Item Qty</th></tr>';
      table.appendChild(thead);
      const tbody = document.createElement('tbody');

      workorders.forEach(w => {
        const wid = workOrderId(w);
        console.log('Rendering work order:', wid, JSON.stringify(w));
        console.log('  CreatedOn raw:', w.CreatedOn || w.CreatedDate || w.createdOn || w.createdDate);
        console.log('  formatDate result:', formatDate(w.CreatedOn || w.CreatedDate || w.createdOn || w.createdDate));

        const row = document.createElement('tr');
        row.className = 'wo-row';
        row.innerHTML = `
          <td>${wid || '—'}</td>
          <td>${w.Name || w.WorkOrderName || w.name || '—'}</td>
          <td>${w.Number || w.WorkOrderNumber || w.number || '—'}</td>
          <td>${w.Status || w.status || '—'}</td>
          <td>${formatDate(w.CreatedOn || w.CreatedDate || w.createdOn || w.createdDate)}</td>
          <td>${customField(w, 'ProductLine', 'Product Line', 'productLine', 'product_line')}</td>
          <td>${customField(w, 'doorName')}</td>
          <td>${customField(w, 'Material', 'material')}</td>
          <td>${customField(w, 'Finish', 'finish')}</td>
          <td class="wo-qty si-qty" data-wid="${wid}">…</td>
        `;

        const siRow = document.createElement('tr');
        siRow.className = 'si-container';
        const siCell = document.createElement('td');
        siCell.colSpan = 10;
        const siDiv = document.createElement('div');
        siDiv.className = 'si-inner';
        siCell.appendChild(siDiv);
        siRow.appendChild(siCell);

        const qtyCell = row.querySelector('.si-qty');
        row.addEventListener('click', () => {
          const isOpen = row.classList.toggle('open');
          if (isOpen && wid) {
            loadShipmentItems(wid, siDiv).then(records => {
              if (qtyCell && records) qtyCell.textContent = records.length;
            });
          }
        });

        tbody.appendChild(row);
        tbody.appendChild(siRow);
      });

      table.appendChild(tbody);
      woDiv.appendChild(table);
    }

    async function loadWorkOrders(pid, woDiv) {
      if (woCache[pid]) { renderWoContent(woCache[pid], woDiv, pid); return woCache[pid]; }
      woDiv.innerHTML = '<p class="wo-loading">Loading work orders…</p>';
      try {
        console.log('Fetching work orders for pid:', pid);
        const records = await fetchWorkOrders(pid);
        console.log('Work orders received:', records.length, records[0]);
        renderWoContent(records, woDiv, pid);
        return records;
      } catch (err) {
        console.error('loadWorkOrders error:', err.message, err.stack);
        woDiv.innerHTML = `<p class="error">Error: ${err.message}</p>`;
      }
    }

    // --- Projects ---

    function renderProjects(projects) {
      const status = document.getElementById('status');
      const tbody = document.getElementById('projects-body');
      const table = document.getElementById('projects-table');

      tbody.innerHTML = '';

      if (!projects.length) {
        status.textContent = 'No projects found.';
        status.style.display = '';
        table.style.display = 'none';
        return;
      }

      projects.forEach(p => {
        const pid = projectId(p);
        console.log('ProjectId:', pid, '| Project object:', JSON.stringify(p));
        const d = p.CreatedOn || p.CreatedDate || p.createdOn || p.createdDate;

        const row = document.createElement('tr');
        row.className = 'project-row';
        row.innerHTML = `
          <td>${pid || '—'}</td>
          <td>${p.Name || p.ProjectName || p.name || p.projectName || '—'}</td>
          <td>${p.Number || p.ProjectNumber || p.number || '—'}</td>
          <td>${p.Status || p.status || '—'}</td>
          <td>${formatDate(d)}</td>
          <td class="wo-qty" data-pid="${pid}">…</td>
        `;

        const woRow = document.createElement('tr');
        woRow.className = 'wo-container';
        const woCell = document.createElement('td');
        woCell.colSpan = 6;
        const woDiv = document.createElement('div');
        woDiv.className = 'wo-inner';
        woCell.appendChild(woDiv);
        woRow.appendChild(woCell);

        const qtyCell = row.querySelector('.wo-qty');
        row.addEventListener('click', () => {
          const isOpen = row.classList.toggle('open');
          if (isOpen && pid) {
            loadWorkOrders(pid, woDiv).then(records => {
              if (qtyCell && records) qtyCell.textContent = records.length;
            });
          }
        });

        tbody.appendChild(row);
        tbody.appendChild(woRow);
      });

      status.style.display = 'none';
      table.style.display = 'table';
    }

    fetch('/api/projects')
      .then(r => r.json())
      .then(data => {
        allProjects = Array.isArray(data) ? data : (data.data || data.projects || []);
        const status = document.getElementById('status');
        if (!allProjects.length) { status.textContent = 'No projects found.'; return; }
        renderProjects(allProjects);
      })
      .catch(err => {
        const status = document.getElementById('status');
        status.className = 'error';
        status.textContent = 'Error loading projects: ' + err.message;
      });

    document.getElementById('filter-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const dateFrom = document.getElementById('date-from').value;
      const dateTo   = document.getElementById('date-to').value;
      const nameQ = document.getElementById('name-filter').value.trim().toLowerCase();
      const numQ  = document.getElementById('number-filter').value.trim().toLowerCase();
      const filtered = allProjects.filter(p => {
        if (nameQ) {
          const name = (p.Name || p.ProjectName || p.name || p.projectName || '').toLowerCase();
          if (!name.includes(nameQ)) return false;
        }
        if (numQ) {
          const num = String(p.Number || p.ProjectNumber || p.number || '').toLowerCase();
          if (!num.includes(numQ)) return false;
        }
        if (dateFrom || dateTo) {
          const d = p.CreatedOn || p.CreatedDate || p.createdOn || p.createdDate;
          if (!d) return false;
          const iso = new Date(d).toISOString().slice(0, 10);
          if (dateFrom && iso < dateFrom) return false;
          if (dateTo   && iso > dateTo)   return false;
        }
        return true;
      });
      renderProjects(filtered);
    });

    document.getElementById('clear-btn').addEventListener('click', function() {
      document.getElementById('name-filter').value = '';
      document.getElementById('number-filter').value = '';
      document.getElementById('date-from').value = '';
      document.getElementById('date-to').value = '';
      renderProjects(allProjects);
    });
  </script>
  </div><!-- /.page-content -->
</body>
</html>
