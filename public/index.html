<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaborCalc</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #333; }
    #status { color: #666; font-style: italic; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { background: #4a90d9; color: white; text-align: left; padding: 10px 12px; }
    td { padding: 9px 12px; border-bottom: 1px solid #ddd; }
    tr.project-row { cursor: pointer; }
    tr.project-row:hover td { background: #f5f8ff; }
    tr.project-row td:first-child::before { content: '▶ '; font-size: 11px; color: #4a90d9; }
    tr.project-row.open td:first-child::before { content: '▼ '; }
    tr.wo-container td { padding: 0; background: #f9f9f9; }
    .wo-inner { padding: 8px 20px 12px 40px; display: none; }
    tr.project-row.open + tr.wo-container .wo-inner { display: block; }
    .wo-inner table { margin-top: 6px; }
    .wo-inner th { background: #6aabe0; font-size: 13px; padding: 7px 10px; }
    .wo-inner td { font-size: 13px; padding: 6px 10px; }
    .wo-loading { color: #888; font-style: italic; font-size: 13px; padding: 6px 0; }
    .wo-qty { color: #888; font-size: 12px; }
    .error { color: red; }
    .filter-form { margin-top: 16px; display: flex; align-items: center; gap: 10px; }
    .filter-form label { font-weight: bold; color: #333; }
    .filter-form input[type="date"] { padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .filter-form button { padding: 7px 16px; background: #4a90d9; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .filter-form button:hover { background: #357abd; }
    .filter-form button.clear { background: #888; }
    .filter-form button.clear:hover { background: #666; }
  </style>
</head>
<body>
  <h1>LaborCalc — Innergy Projects</h1>
  <form class="filter-form" id="filter-form">
    <label for="date-picker">Filter by Created On:</label>
    <input type="date" id="date-picker">
    <button type="submit">Filter</button>
    <button type="button" class="clear" id="clear-btn">Clear</button>
  </form>
  <p id="status">Loading projects...</p>
  <table id="projects-table" style="display:none">
    <thead>
      <tr>
        <th>Project Name</th>
        <th>Number</th>
        <th>Status</th>
        <th>Created On</th>
        <th>WO Qty</th>
      </tr>
    </thead>
    <tbody id="projects-body"></tbody>
  </table>

  <script>
    let allProjects = [];
    const woCache = {};

    function formatDate(val) {
      return val ? new Date(val).toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'}) : '—';
    }

    function projectId(p) {
      return p.Id || p.ProjectId || p.id || p.projectId;
    }

    function customField(w, ...keys) {
      for (const key of keys) {
        if (w[key] !== undefined && w[key] !== null && w[key] !== '') return w[key];
      }
      // Also search CustomFields array if present
      const cf = w.CustomFields || w.customFields;
      if (Array.isArray(cf)) {
        for (const key of keys) {
          const match = cf.find(f => (f.Name || f.name || '').toLowerCase() === key.toLowerCase());
          if (match) return match.Value || match.value || '—';
        }
      }
      return '—';
    }

    function buildWoTable(workorders) {
      if (!workorders.length) return '<p class="wo-loading">No work orders found.</p>';
      const rows = workorders.map(w => `
        <tr>
          <td>${w.Name || w.WorkOrderName || w.name || '—'}</td>
          <td>${w.Number || w.WorkOrderNumber || w.number || '—'}</td>
          <td>${w.Status || w.status || '—'}</td>
          <td>${formatDate(w.CreatedOn || w.CreatedDate || w.createdOn || w.createdDate)}</td>
          <td>${customField(w, 'ProductLine', 'Product Line', 'productLine', 'product_line')}</td>
          <td>${customField(w, 'DoorStyle', 'Door Style', 'doorStyle', 'door_style')}</td>
          <td>${customField(w, 'Material', 'material')}</td>
          <td>${customField(w, 'Finish', 'finish')}</td>
        </tr>`).join('');
      return `<table>
        <thead><tr><th>Work Order</th><th>Number</th><th>Status</th><th>Created On</th><th>Product Line</th><th>Door Style</th><th>Material</th><th>Finish</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    async function fetchWorkOrders(pid) {
      if (woCache[pid]) return woCache[pid];
      const res = await fetch(`/api/workorders/${encodeURIComponent(pid)}`);
      const data = await res.json();
      const records = Array.isArray(data) ? data : [];
      woCache[pid] = records;
      return records;
    }

    async function loadWorkOrders(pid, woDiv) {
      if (woCache[pid]) { woDiv.innerHTML = buildWoTable(woCache[pid]); return; }
      woDiv.innerHTML = '<p class="wo-loading">Loading work orders…</p>';
      try {
        const records = await fetchWorkOrders(pid);
        woDiv.innerHTML = buildWoTable(records);
      } catch (err) {
        woDiv.innerHTML = `<p class="error">Error: ${err.message}</p>`;
      }
    }

    function renderProjects(projects) {
      const status = document.getElementById('status');
      const tbody = document.getElementById('projects-body');
      const table = document.getElementById('projects-table');

      tbody.innerHTML = '';

      if (!projects.length) {
        status.textContent = 'No projects found.';
        status.style.display = '';
        table.style.display = 'none';
        return;
      }

      projects.forEach(p => {
        const pid = projectId(p);
        const d = p.CreatedOn || p.CreatedDate || p.createdOn || p.createdDate;

        // Project row
        const row = document.createElement('tr');
        row.className = 'project-row';
        row.innerHTML = `
          <td>${p.Name || p.ProjectName || p.name || p.projectName || '—'}</td>
          <td>${p.Number || p.ProjectNumber || p.number || '—'}</td>
          <td>${p.Status || p.status || '—'}</td>
          <td>${formatDate(d)}</td>
          <td class="wo-qty" data-pid="${pid}">…</td>
        `;

        // Work orders container row
        const woRow = document.createElement('tr');
        woRow.className = 'wo-container';
        const woCell = document.createElement('td');
        woCell.colSpan = 5;
        const woDiv = document.createElement('div');
        woDiv.className = 'wo-inner';
        woCell.appendChild(woDiv);
        woRow.appendChild(woCell);

        row.addEventListener('click', () => {
          const isOpen = row.classList.toggle('open');
          if (isOpen && pid) loadWorkOrders(pid, woDiv);
        });

        tbody.appendChild(row);
        tbody.appendChild(woRow);
      });

      status.style.display = 'none';
      table.style.display = 'table';

      // Fetch WO counts for all visible projects in parallel
      projects.forEach(p => {
        const pid = projectId(p);
        if (!pid) return;
        fetchWorkOrders(pid)
          .then(records => {
            const cell = document.querySelector(`.wo-qty[data-pid="${pid}"]`);
            if (cell) cell.textContent = records.length;
          })
          .catch(() => {
            const cell = document.querySelector(`.wo-qty[data-pid="${pid}"]`);
            if (cell) cell.textContent = '—';
          });
      });
    }

    fetch('/api/projects')
      .then(r => r.json())
      .then(data => {
        allProjects = Array.isArray(data) ? data : (data.data || data.projects || []);
        const status = document.getElementById('status');
        if (!allProjects.length) { status.textContent = 'No projects found.'; return; }
        renderProjects(allProjects);
      })
      .catch(err => {
        const status = document.getElementById('status');
        status.className = 'error';
        status.textContent = 'Error loading projects: ' + err.message;
      });

    document.getElementById('filter-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const picked = document.getElementById('date-picker').value;
      if (!picked) { renderProjects(allProjects); return; }
      const filtered = allProjects.filter(p => {
        const d = p.CreatedOn || p.CreatedDate || p.createdOn || p.createdDate;
        if (!d) return false;
        return new Date(d).toISOString().slice(0, 10) === picked;
      });
      renderProjects(filtered);
    });

    document.getElementById('clear-btn').addEventListener('click', function() {
      document.getElementById('date-picker').value = '';
      renderProjects(allProjects);
    });
  </script>
</body>
</html>
