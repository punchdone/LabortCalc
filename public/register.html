<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register User — Rainier Woodworking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f7f4; }
    .page-content { max-width: 560px; margin: 32px auto; padding: 0 20px; }

    nav { background: #1e421e; border-bottom: 2px solid #3a7d44; display: flex; align-items: center; padding: 0 28px; height: 52px; gap: 8px; }
    .nav-brand { color: #c8e6c9; font-size: 15px; font-weight: bold; letter-spacing: 0.03em; margin-right: auto; text-decoration: none; }
    .nav-brand:hover { color: #fff; }
    .nav-link { color: #c8e6c9; text-decoration: none; font-size: 14px; padding: 6px 14px; border-radius: 4px; transition: background 0.15s; }
    .nav-link:hover { background: rgba(58,125,68,0.6); color: #fff; }
    .nav-link.active { background: #3a7d44; color: #fff; }
    .nav-sep { width: 1px; height: 24px; background: rgba(200,230,201,0.2); }
    .nav-signout { color: #a5c8a7; font-size: 13px; padding: 6px 12px; border-radius: 4px; cursor: pointer; background: none; border: none; font-family: inherit; }
    .nav-signout:hover { background: rgba(200,80,80,0.25); color: #fff; }

    h1 { color: #2a5c2a; margin: 0 0 24px 0; font-size: 22px; }

    .form-card {
      background: #fff;
      border: 1px solid #cde0cd;
      border-radius: 8px;
      padding: 28px 32px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .form-card h2 { margin: 0 0 20px 0; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.07em; color: #fff; background: #3a7d44; display: inline-block; padding: 4px 12px; border-radius: 4px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-field label { font-size: 13px; font-weight: bold; color: #444; }
    .form-field input { padding: 9px 12px; border: 1px solid #bbb; border-radius: 4px; font-size: 14px; font-family: inherit; }
    .form-field input:focus { outline: none; border-color: #3a7d44; box-shadow: 0 0 0 2px rgba(58,125,68,0.2); }
    .hint { font-size: 12px; color: #888; margin-top: 2px; }
    .btn-submit { width: 100%; padding: 10px; background: #3a7d44; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; font-family: inherit; margin-top: 4px; }
    .btn-submit:hover { background: #2e6336; }
    .form-msg { margin-top: 14px; padding: 10px 14px; border-radius: 4px; font-size: 13px; display: none; }
    .form-msg.success { display: block; background: #d4edda; color: #1e7e34; border: 1px solid #c3e6cb; }
    .form-msg.error   { display: block; background: #fdecea; color: #c0392b; border: 1px solid #f5c6cb; }

    .users-card {
      margin-top: 28px;
      background: #fff;
      border: 1px solid #cde0cd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .users-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 0; }
    .section-title { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; color: #fff; background: #3a7d44; display: inline-block; padding: 3px 10px; border-radius: 4px 4px 0 0; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #3a7d44; color: #fff; text-align: left; padding: 10px 12px; font-size: 13px; }
    td { padding: 9px 12px; border-bottom: 1px solid #e8f0e8; font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f2f7f2; }
    .btn-delete { background: none; border: none; color: #bbb; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 3px; }
    .btn-delete:hover { color: #c0392b; background: #fdecea; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">Rainier Woodworking</a>
    <a href="/" class="nav-link">Home</a>
    <a href="/laborcalc" class="nav-link">LaborCalc</a>
    <a href="/activity-drivers" class="nav-link">Activity Drivers</a>
    <a href="/catalogue" class="nav-link">Catalogue</a>
    <a href="/register" class="nav-link active">Users</a>
    <div class="nav-sep"></div>
    <form method="POST" action="/auth/logout" style="margin:0">
      <button type="submit" class="nav-signout">Sign Out</button>
    </form>
  </nav>

  <div class="page-content">
    <h1>Register User</h1>

    <div class="form-card">
      <h2>New Account</h2>
      <form id="reg-form">
        <div class="form-field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="off" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" required>
          <span class="hint">Minimum 6 characters</span>
        </div>
        <div class="form-field">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" required>
        </div>
        <button type="submit" class="btn-submit">Create Account</button>
        <div class="form-msg" id="form-msg"></div>
      </form>
    </div>

    <div class="users-card">
      <div class="users-header">
        <span class="section-title">Existing Users</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th style="width:40px"></th>
          </tr>
        </thead>
        <tbody id="users-body">
          <tr><td colspan="2" style="color:#888;font-style:italic;padding:12px">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const msgEl = document.getElementById('form-msg');

    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        const users = await res.json();
        const tbody = document.getElementById('users-body');
        if (!users.length) {
          tbody.innerHTML = '<tr><td colspan="2" style="color:#888;font-style:italic;padding:12px">No users found.</td></tr>';
          return;
        }
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${esc(u.username)}</td>
            <td><button class="btn-delete" data-id="${u._id}" title="Delete">&#x2715;</button></td>
          </tr>
        `).join('');
        tbody.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', () => deleteUser(btn.dataset.id, btn));
        });
      } catch {
        document.getElementById('users-body').innerHTML =
          '<tr><td colspan="2" style="color:red;padding:12px">Failed to load users.</td></tr>';
      }
    }

    async function deleteUser(id, btn) {
      const row = btn.closest('tr');
      const name = row.querySelector('td').textContent;
      if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
      try {
        await fetch(`/api/users/${id}`, { method: 'DELETE' });
        loadUsers();
      } catch {
        alert('Failed to delete user.');
      }
    }

    document.getElementById('reg-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;

      msgEl.className = 'form-msg';

      if (password.length < 6) {
        msgEl.className = 'form-msg error';
        msgEl.textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (password !== confirm) {
        msgEl.className = 'form-msg error';
        msgEl.textContent = 'Passwords do not match.';
        return;
      }

      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          msgEl.className = 'form-msg error';
          msgEl.textContent = data.error || 'Failed to create account.';
          return;
        }
        msgEl.className = 'form-msg success';
        msgEl.textContent = `Account "${username}" created successfully.`;
        this.reset();
        loadUsers();
      } catch {
        msgEl.className = 'form-msg error';
        msgEl.textContent = 'Network error — could not create account.';
      }
    });

    function esc(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    loadUsers();
  </script>
</body>
</html>
