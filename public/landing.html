  <title>Rainier Woodworking — Tools</title>

      background-size: cover;
      background-position: center bottom;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }

    /* Nav ribbon */
    nav {
      background: rgba(30, 66, 30, 0.92);
      backdrop-filter: blur(4px);
      border-bottom: 2px solid #3a7d44;
      display: flex;
      align-items: center;
      padding: 0 28px;
      height: 52px;
      gap: 8px;
    }
    .nav-brand {
      color: #c8e6c9;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.03em;
      margin-right: auto;
    }
    .nav-link {
      color: #c8e6c9;
      text-decoration: none;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .nav-link:hover {
      background: rgba(58, 125, 68, 0.6);
      color: #fff;
    }
    .nav-link.active {
      background: #3a7d44;
      color: #fff;
    }
    .nav-sep {
      width: 1px;
      height: 24px;
      background: rgba(200, 230, 201, 0.2);
    }
    .nav-signout {
      color: #a5c8a7;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-signout:hover {
      background: rgba(200, 80, 80, 0.25);
      color: #fff;
    }

    /* Main content */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }
    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      max-width: 900px;
      width: 100%;
    }
    .tool-card {
      background: rgba(255, 255, 255, 0.93);
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.45);
      padding: 32px 36px;
      width: 260px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .tool-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
    }
    .tool-card-icon {
      font-size: 32px;
      margin-bottom: 14px;
    }
    .tool-card-title {
      font-size: 20px;
      font-weight: bold;
      color: #3a7d44;
      margin-bottom: 8px;
    }
    .tool-card-desc {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }

    /* Branding footer */
    footer {
      text-align: center;
      padding: 16px;
      color: rgba(200, 230, 201, 0.55);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <nav>
    <span class="nav-brand">Rainier Woodworking</span>
    <a href="/laborcalc" class="nav-link">LaborCalc</a>
    <a href="/activity-drivers" class="nav-link">Activity Drivers</a>
    <div class="nav-sep"></div>
    <form action="/auth/logout" method="POST" style="margin:0">
      <button type="submit" class="nav-signout">Sign Out</button>
    </form>
  </nav>

  <main>
    <div class="card-grid">
      <a href="/laborcalc" class="tool-card">
        <div class="tool-card-icon">🪵</div>
        <div class="tool-card-title">LaborCalc</div>
        <div class="tool-card-desc">Browse Innergy projects, work orders, and shipment items. Track quantities and completion status.</div>
      </a>
      <a href="/activity-drivers" class="tool-card">
        <div class="tool-card-icon">⚙️</div>
        <div class="tool-card-title">Activity Drivers</div>
        <div class="tool-card-desc">Manage work center activity drivers and quantities used in labor cost calculations.</div>
      </a>
    </div>
  </main>

  <footer>Rainier Woodworking &mdash; Internal Tools</footer>
</body>
</html>
